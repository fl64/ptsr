# SMC-PAD actions (127): one page of up to 12 cells per view. Labels: one meaning each (134).
# Cells 1-12 count from the top left, in physical rows. A second page is rejected.
# The screens view and the bottom row (back, undo, redo, panic) are fixed in the program.

[[view]]
name = "pads"
page = 1
cells = [
  { cell = 1, label = "edit pad", action = "pad.edit" },
  { cell = 2, label = "copy pad", action = "pad.copy" },
  { cell = 3, label = "swap pads", action = "pad.take" },
  { cell = 4, label = "mark pad", action = "pad.mark_toggle" },
  { cell = 5, label = "play mode", action = "pad.mode_next" },
  { cell = 6, label = "clear pad", action = "pad.clear" },
  { cell = 7, label = "pitch gate", action = "pad.pitch_gate_toggle" },
  { cell = 8, label = "mark bank", action = "pad.mark_bank" },
  { cell = 9, label = "hide pads", action = "ui.pads_toggle" },
  { cell = 10, label = "record output", action = "record.output" },
  { cell = 11, label = "chop pad", action = "screen.chop" },
]

[[view]]
name = "pad_edit"
page = 1
cells = [
  { cell = 1, label = "play mode", action = "pad.mode_next" },
  { cell = 2, label = "reset pad", action = "pad.clear" },
  { cell = 3, label = "pitch gate", action = "pad.pitch_gate_toggle" },
  { cell = 4, label = "copy pad", action = "pad.copy" },
]

[[view]]
name = "pattern"
page = 1
cells = [
  { cell = 1, label = "edit steps", action = "pattern.step_edit" },
  { cell = 2, label = "steps wider", action = "pattern.view_prev", pair = "grid:lower" },
  { cell = 3, label = "steps finer", action = "pattern.view_next", pair = "grid:upper" },
  { cell = 4, label = "A1 setup", action = "pattern.controls" },
  { cell = 5, label = "record A1", action = "pattern.record" },
  { cell = 6, label = "erase hits", action = "pattern.erase" },
  { cell = 7, label = "undo A1 pass", action = "pattern.undo" },
  { cell = 8, label = "clear A1", action = "pattern.clear" },
  { cell = 9, label = "hide empty", action = "pattern.overview_empty_toggle" },
  { cell = 10, label = "tap tempo", action = "transport.tap" },
]

[[view]]
name = "files"
page = 1
cells = [
  { cell = 1, label = "take file", action = "browser.hold" },
  { cell = 2, label = "load to pad", action = "browser.load" },
  { cell = 4, label = "star file", action = "browser.favorite_toggle" },
  { cell = 6, label = "listen file", action = "browser.preview_toggle" },
  { cell = 7, label = "chop file", action = "screen.chop" },
]

[[view]]
name = "chop"
page = 1
cells = [
  { cell = 1, label = "cut here", action = "chop.cut" },
  { cell = 2, label = "equal parts", action = "chop.parts" },
  { cell = 3, label = "cut by hits", action = "chop.hits" },
  { cell = 4, label = "put on pads", action = "chop.assign" },
  { cell = 5, label = "loop play", action = "chop.loop_toggle" },
  { cell = 6, label = "play range", action = "chop.play_mode" },
  { cell = 7, label = "cursor step", action = "chop.snap_toggle" },
  { cell = 8, label = "hear as pad", action = "chop.as_pad_toggle" },
  { cell = 9, label = "whole sample", action = "chop.region_clear" },
  { cell = 11, label = "edit slice", action = "chop.edit" },
  { cell = 12, label = "fill pads", action = "chop.commit" },
]

[[view]]
name = "chop_edit"
page = 1
cells = [
  { cell = 1, label = "level to peak", action = "chop.normalize" },
  { cell = 2, label = "fewer hits", action = "chop.hits_back" },
  { cell = 3, label = "join left", action = "marker.delete" },
  { cell = 4, label = "join right", action = "slice.end_delete" },
  { cell = 5, label = "whole sample", action = "chop.region_clear" },
]

[[view]]
name = "settings"
page = 1
cells = [
  { cell = 2, label = "learn control", action = "settings.learn" },
  { cell = 3, label = "forget control", action = "settings.clear" },
]
