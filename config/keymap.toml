# Default keyboard (draft). Physical keys, not characters.
# The left half is pads only. Shift on a pad gives full velocity.

[pads]
keys = ["1","2","3","4", "Q","W","E","R", "A","S","D","F", "Z","X","C","V"]
default_velocity = 80          # about -4 dB below Shift (127), so accents are audible
shift_velocity = 127

[global]
F2 = "screen.pads"
F3 = "screen.chop"
F4 = "screen.fx"
F6 = "screen.files"
F12 = "screen.settings"           # audio; input debug is a tab inside (02b)
PageUp = "bank.prev"
PageDown = "bank.next"
"Ctrl+1" = "bank.1"            # Ctrl+digit picks a bank; Shift stays velocity only
"Ctrl+2" = "bank.2"
"Ctrl+3" = "bank.3"
"Ctrl+4" = "bank.4"
"Ctrl+5" = "bank.5"
"Ctrl+6" = "bank.6"
"Ctrl+7" = "bank.7"
"Ctrl+8" = "bank.8"
"Ctrl+X" = "pad.take"            # the next pad hit swaps the two pads
"Ctrl+C" = "pad.copy"            # the next pad hit gets a copy of this one (83a)
"[" = "master.volume_down"         # same physical keys as х ъ in the Russian layout
"]" = "master.volume_up"
F10 = "learn.toggle"          # bind controller knobs and buttons to what the screen shows (47, 57)
F1 = "help.toggle"            # not "?": that is Shift plus a character, not a physical key
"Ctrl+Z" = "edit.undo"
"Ctrl+S" = "session.save"
"Ctrl+P" = "project.pick"     # the folders of the projects root with a project.toml; typing a name makes one
"Ctrl+O" = "ui.pads_toggle"   # hide the pad grid on F2, F6, F3: the wave takes its rows (32)
Esc = "ui.back"
"Ctrl+Q" = "app.quit"
Space = "metronome.click"     # test click; the chop and files screens use Space for their own actions
"Alt+R" = "record.mic"       # hold: record the microphone, release: stop (83a)
"Ctrl+T" = "record.output"    # toggle: record what ptsr plays right now

# Two hands (21): the left fingers play, the left thumb holds Ctrl and Alt for the right
# hand; the right hand moves with the direction letters J L I K, the arrows are the same
# keys. A tap is the fine step of a value or a bound, a held key repeats the coarse one.

# The edit layer: over the screen keys while an edit mode is open, the same on every
# screen. Enter and Esc close it.
[edit]
I = "edit.param_prev"
K = "edit.param_next"
Up = "edit.param_prev"
Down = "edit.param_next"
Tab = "edit.page_next"          # a whole page: the knobs turn the next three (54)
"Shift+Tab" = "edit.page_prev"
J = "edit.value_dec"
L = "edit.value_inc"
Left = "edit.value_dec"
Right = "edit.value_inc"
Enter = "ui.back"

[screens.chop]
Space = "transport.play_stop"
O = "chop.play_mode"         # play: to the end / to the cut / the slice under the cursor
"Alt+O" = "chop.loop_toggle" # Space loops what O picked until the next Space (49)
"Alt+P" = "chop.as_pad_toggle" # play a slice with its pad's pitch, volume, envelope, filter (50)
J = "chop.cursor_left"       # the step follows the view: zoom in for a finer one
L = "chop.cursor_right"
Left = "chop.cursor_left"
Right = "chop.cursor_right"
I = "chop.zoom_in"           # around the cursor
K = "chop.zoom_out"
Up = "chop.zoom_in"
Down = "chop.zoom_out"
"Ctrl+J" = "slice.start_left"    # the left thumb holds Ctrl: the left bound
"Ctrl+L" = "slice.start_right"
"Ctrl+Left" = "slice.start_left"
"Ctrl+Right" = "slice.start_right"
"Alt+J" = "slice.end_left"       # the left thumb holds Alt: the right bound
"Alt+L" = "slice.end_right"
"Alt+Left" = "slice.end_left"
"Alt+Right" = "slice.end_right"
M = "chop.cut"               # the bottom row acts at the cursor: cut, region start, end
Comma = "chop.region_start"
Period = "chop.region_end"
"Ctrl+Comma" = "chop.region_clear"
Backspace = "marker.delete"
"Ctrl+Backspace" = "marker.delete"   # the bound a held Ctrl / Alt lights: the start
"Alt+Backspace" = "slice.end_delete" # the end
N = "chop.snap_toggle"       # cursor: even steps / hit to hit / cut to cut
"Ctrl+G" = "chop.normalize"  # the pad this chop was opened from: a −1 dB peak (83a)
H = "chop.hits"             # chop by hits, one threshold step lower per press (83a)
"Shift+H" = "chop.hits_back"  # one step back, stopping at −6 dB (83a)
Y = "chop.parts"             # equal parts 2-32, away from the keys the hand moves with
P = "chop.assign"            # the assign mode: slices onto pads, by hand from slice 1
Tab = "chop.assign_order"    # assigning: in order / by hand (83a)
Enter = "chop.edit"          # listen: the slice edit on / off; assigning: apply the plan

[screens.files]
I = "browser.up"
K = "browser.down"
L = "browser.enter"
J = "browser.parent"
Up = "browser.up"
Down = "browser.down"
Right = "browser.enter"
Left = "browser.parent"
Slash = "browser.filter"
Space = "browser.preview_toggle"
Enter = "browser.hold"        # "file in hand": a pad hit puts it there, Enter again the selected pad; a folder opens
"Ctrl+Enter" = "browser.load" # the file loads onto the selected pad at once (41)
"Ctrl+B" = "browser.favorite_toggle"

[screens.pads]
"Ctrl+N" = "pad.rename"
U = "bank.prev"        # U/O turn the banks, with the edit open or closed too (83a)
O = "bank.next"
J = "edit.value_dec"   # the direction keys change values, not banks (83a)
L = "edit.value_inc"
Left = "edit.value_dec"
Right = "edit.value_inc"
Enter = "pad.edit"     # the pad edit on / off
H = "pad.mode_next"    # one-shot / gate ("hold"); commands stay off the left half
Backspace = "pad.clear"
Tab = "edit.page_next"        # the panel's blocks, with the edit closed too (70)
"Shift+Tab" = "edit.page_prev"
I = "edit.param_prev"         # one parameter, with the edit closed too (70)
K = "edit.param_next"
Up = "edit.param_prev"
Down = "edit.param_next"
"Ctrl+A" = "pad.mark_bank"  # marks the 16 pads of the open bank; again unmarks them
M = "pad.mark_toggle"    # the marker key: marks pads here, a cut on the chop screen

# Shared effects: the page keys select FX 1 or FX 2.
[screens.fx]
Tab = "edit.page_next"
"Shift+Tab" = "edit.page_prev"
I = "edit.param_prev"
K = "edit.param_next"
Up = "edit.param_prev"
Down = "edit.param_next"
J = "edit.value_dec"
L = "edit.value_inc"
Left = "edit.value_dec"
Right = "edit.value_inc"

[screens.settings]
I = "settings.row_prev"
K = "settings.row_next"
J = "settings.value_prev"
L = "settings.value_next"
Up = "settings.row_prev"
Down = "settings.row_next"
Left = "settings.value_prev"
Right = "settings.value_next"
Tab = "settings.tab_next"
Enter = "settings.learn"        # MIDI tab: move a control to assign it
Backspace = "settings.clear"
