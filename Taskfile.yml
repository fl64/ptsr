# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  default:
    desc: List tasks
    cmd: task --list
    silent: true

  build:
    desc: Build the program into target/release/ptsr
    cmd: cargo build --release -p ptsr

  run:
    desc: Build and run in the current terminal
    interactive: true
    cmd: cargo run --release -p ptsr

  test:
    desc: Run the full test set
    cmds:
      - task: test:full

  test:changed:
    desc: Run tests for paths changed against origin/master
    preconditions: &nextest-cli
      - sh: command -v cargo-nextest >/dev/null 2>&1
        msg: 'cargo-nextest is required. Install it with: cargo install cargo-nextest --version 0.9.152 --locked'
    cmds:
      - python3 -B -m unittest discover -s scripts -p test_test_changed.py
      - python3 -B scripts/test_changed.py

  test:fast:
    desc: Run all tests except the slow group
    preconditions: *nextest-cli
    cmd: cargo nextest run --workspace -E 'not group(slow)'

  test:full:
    desc: Run all tests, including slow tests and offline renders
    preconditions: *nextest-cli
    cmd: cargo nextest run --workspace

  screens:
    desc: Generate and check the offline ANSI screen catalogue
    cmd: cargo test -p ptsr --bin ptsr screens::tests -- --nocapture

  bench:
    desc: Audio callback benchmark (32 voices, buffer 128, 48 kHz)
    cmd: cargo bench -p engine

  bench:quick:
    desc: Short local callback benchmark
    env:
      PTSR_BENCH_QUICK: '1'
    cmd: cargo bench -p engine

  lint:
    desc: Clippy, warnings are errors
    cmd: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    desc: Format the code
    cmd: cargo fmt --all

  licenses:
    desc: Check dependency licenses with cargo-deny
    preconditions:
      - sh: command -v cargo-deny >/dev/null 2>&1
        msg: 'cargo-deny is required. Install it with: cargo install cargo-deny --version 0.20.2 --locked'
    cmd: cargo deny check licenses

  names:
    desc: Test the name checker and check new branch commits
    cmds:
      - python3 -B -m unittest discover -s scripts -p test_check_names.py
      - python3 -B scripts/check_names.py --range origin/master..HEAD

  specs:sync:
    desc: Test spec sync and check archived scenarios
    cmds:
      - python3 -B -m unittest discover -s scripts -p test_check_spec_sync.py
      - python3 -B scripts/check_spec_sync.py

  specs:check:
    desc: Check OpenSpec, archived scenarios, merged changes and catalogue names
    cmds:
      - python3 -B -m unittest discover -s scripts -p 'test_check_*.py'
      - task: openspec:check
      - python3 -B scripts/check_spec_sync.py --only sync
      - python3 -B scripts/check_spec_sync.py --only unarchived
      - python3 -B scripts/check_catalogue_names.py

  file-size:
    desc: Reject growth in the two large source files compared with origin/master
    cmd: python3 -B scripts/check_file_growth.py --base origin/master

  hooks:install:
    desc: Enable commit title and signoff checks in this clone
    preconditions:
      - sh: |
          current="$(git config --get core.hooksPath || true)"
          test -z "$current" || test "$current" = .githooks
        msg: 'core.hooksPath has another value. Review its hooks before you change it.'
    cmd: git config --local core.hooksPath .githooks

  check:
    desc: Run the full checks and any required callback benchmark
    cmds:
      - task: names
      - task: specs:check
      - task: file-size
      - cargo fmt --all --check
      - task: licenses
      - task: lint
      - task: test:full
      - python3 -B -m unittest discover -s scripts -p test_bench_if_changed.py
      - python3 -B scripts/bench_if_changed.py

  openspec:init:
    desc: Set up OpenSpec skills and commands (Pi by default)
    vars:
      OPENSPEC_TOOLS: '{{.OPENSPEC_TOOLS | default "pi"}}'
    env:
      OPENSPEC_TOOLS: '{{.OPENSPEC_TOOLS}}'
    preconditions: &openspec-cli
      - sh: command -v openspec >/dev/null 2>&1
        msg: 'OpenSpec CLI is required. Install it with: npm install -g @fission-ai/openspec'
    cmd: openspec init --tools "$OPENSPEC_TOOLS" --no-animation .

  openspec:update:
    desc: Update the configured OpenSpec skills and commands
    preconditions: *openspec-cli
    cmd: openspec update .

  openspec:check:
    desc: Validate all OpenSpec specs and active changes strictly
    preconditions: *openspec-cli
    cmd: openspec validate --all --strict --no-interactive
