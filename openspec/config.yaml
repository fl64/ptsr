schema: spec-driven

context: |
  ptsr — a terminal sampler for Linux written in Rust (JACK/PipeWire, midir, ratatui + crossterm with the kitty keyboard protocol, symphonia, aubio, rtrb, TOML). License GPL-3.0.
  The owner is a musician and does not read code: they check the specs, the renders in renders/ and the program by hand. Write all artifacts in English; all UI text is in English. The owner is Russian-speaking, so keep proposals short, plain and jargon-free. OpenSpec keywords (SHALL, WHEN, THEN) stay as they are.
  Current baseline: loading, chopping, pad play and shaping, projects, recording, MIDI learn and shared FX. Change 82 (F4 FX and safe X-Session controls) is accepted and archived. The SMC-PAD profile is still a template; transport and patterns are not implemented.
  Keymap cleanup 83a is accepted and archived at 2b084d1. The owner accepted without completing the manual checks in docs/LIVE-CHECKS.md; no listening or physical SMC-PAD pass is implied. The owner checked and accepted input parity 84 on 2026-11-03; it is archived in openspec/changes/archive/2026-11-03-84-input-parity. Physical-controller checks remain unverified. Callback benchmark peaks above the 50% budget target remain unresolved. Report-only change 84a-benchmark-report is active, pending owner acceptance: paired wall/CPU times, estimated gaps, exceedance counts and overhead; no sound, workload, target or wall p99 gate changes. Slow-core CPU spikes remain open. Input modes 85 is next in the input plan, not active. Next: input and visual control (85–90), SMC-PAD and its command panel (91–94), then transport and patterns (95–101). Read docs/PROJECT.md and docs/plans/README.md. The goal is every non-text action from the SMC-PAD without losing keyboard controls.
  Requirements are drafts and will change. docs/VISION.md and docs/plans/ are guides, not requirements. Deferred changes are preparation only; activate one change before implementation. Normally use a separate branch. The owner explicitly requested plan/controller-first-patterns for 84 and confirmed this branch exception for 84a; no preparation merge is needed. Push and PR need a separate request. The shipped 83a keys are J/L values, U/O banks and Tab assign order.
  Hard rules (real time, keyboard, tests) are in AGENTS.md.

rules:
  proposal:
    - Write short and without jargon; the owner is not a programmer
    - Always state what is out of scope
    - End with a "How to verify" section — steps by hand and what to listen for
  tasks:
    - Every audio task ends with a render in renders/ or an automated render test
    - Tasks are small; each one ends in a working state and a commit
