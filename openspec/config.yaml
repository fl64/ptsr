schema: spec-driven

context: |
  ptsr — a terminal sampler for Linux written in Rust (JACK/PipeWire, midir, ratatui + crossterm with the kitty keyboard protocol, symphonia, aubio, rtrb, TOML). License GPL-3.0.
  The owner is a musician and does not read code: they check the specs, the renders in renders/ and the program by hand. Write all artifacts in English; all UI text is in English. The owner is Russian-speaking, so keep proposals short, plain and jargon-free. OpenSpec keywords (SHALL, WHEN, THEN) stay as they are.
  Current baseline: loading, chopping, pad play and shaping, projects, recording, MIDI learn and shared FX. Change 82 (F4 FX and safe X-Session controls) is accepted and archived. The SMC-PAD profile is still a template; transport and patterns are not implemented.
  Keymap cleanup 83a is accepted and archived at 2b084d1. The owner accepted without completing the manual checks in docs/LIVE-CHECKS.md; no listening or physical SMC-PAD pass is implied. The owner checked and accepted input parity 84 on 2026-11-03; it is archived in openspec/changes/archive/2026-11-03-84-input-parity. Physical-controller checks remain unverified. Callback benchmark peaks above the 50% budget target remain unresolved. The owner accepted report-only change 84a on 2026-11-03; it is archived in openspec/changes/archive/2026-11-03-84a-benchmark-report. It adds paired wall/CPU times, estimated gaps, exceedance counts and overhead; no sound, workload, target or wall p99 gate changes. Slow-core CPU spikes remain open. The owner accepted input modes 85 on 2026-11-03. It is archived in openspec/changes/archive/2026-11-03-85-input-modes. Implementation, offline tests and renders are complete. It shares pad handling and MIDI state, orders controller commands before following hits, preserves actual deferred releases, and separately repairs mixed Chop holds and late direct notifications. Dispatch was moved without body changes. Keys, profiles, saved data and the callback stay unchanged. This is overall acceptance. Physical-controller checks remain unverified, and separate WAV listening remains unreported. The owner accepted the screen registry (86) on 2026-11-04. Its archive is openspec/changes/archive/2026-11-04-86-screen-registry. Implementation is complete at a186fbb. Offline verification is recorded in e90543c. The registry preserves valid-state keys, help, learned assignments and FX rules. Invalid shared MIDI state rejects new actions while preserving original releases and pending-input order. This is overall acceptance, not individual keyboard, physical-controller or WAV listening results. Section 86 of docs/LIVE-CHECKS.md records evidence and separate keyboard, controller and listening checks. The callback timing issue remains open. Change 87 is next, but it is not active. Continue with input and visual changes (87–90), SMC-PAD and its command panel (91–94), then transport and patterns (95–101). Read docs/PROJECT.md and docs/plans/README.md. The goal is every non-text action from the SMC-PAD without losing keyboard controls.
  Requirements are drafts and will change. docs/VISION.md and docs/plans/ are guides, not requirements. Deferred changes are preparation only; activate one change before implementation. Normally use a separate branch. The owner explicitly requested plan/controller-first-patterns for 84, 84a and 85; this is a branch exception. Closure of 85 and work on 86 now share 86-screen-registry and one MR by owner request. Keep their commits separate. On 2026-11-04 the owner authorized archive of 86, local signed-off commits and PR publication for the combined 85–86 work. The owner also requested an ASD-STE100 review of the relevant documents in that PR. The shipped 83a keys are J/L values, U/O banks and Tab assign order.
  Hard rules (real time, keyboard, tests) are in AGENTS.md.

rules:
  proposal:
    - Write short and without jargon; the owner is not a programmer
    - Always state what is out of scope
    - End with a "How to verify" section — steps by hand and what to listen for
  tasks:
    - Every audio task ends with a render in renders/ or an automated render test
    - Tasks are small; each one ends in a working state and a commit
