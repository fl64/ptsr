schema: spec-driven

context: |
  ptsr is a Linux terminal sampler written in Rust. License: GPL-3.0.
  The stack uses JACK/PipeWire, midir, ratatui, crossterm with the kitty keyboard protocol, symphonia, aubio, rtrb and TOML.
  The owner is a musician and does not read code. The owner checks specifications, renders in renders/ and the program by hand.
  Write all artifacts and UI text in English. Speak Russian with the owner. Keep proposals short, plain and without jargon.
  Keep the OpenSpec keywords SHALL, WHEN and THEN unchanged.

  The current baseline includes sample loading, chopping, pad play and shaping, projects, recording, MIDI learn and shared FX.
  The owner accepted change 82, which adds F4 FX and safe X-Session controls. Its archive is complete.
  The SMC-PAD profile remains a template. Transport and patterns are not implemented.

  The owner accepted keymap cleanup 83a without completing the manual checks in docs/LIVE-CHECKS.md.
  Its archive commit is 2b084d1. This acceptance implies no listening or physical SMC-PAD pass.
  The shipped keys are J/L for values, U/O for banks and Tab for assignment order.

  The owner checked and accepted input parity 84 on 2026-11-03.
  Its archive is openspec/changes/archive/2026-11-03-84-input-parity. Physical-controller checks remain unverified.
  Callback benchmark peaks above the 50% budget target remain unresolved.

  The owner accepted report-only change 84a on 2026-11-03.
  Its archive is openspec/changes/archive/2026-11-03-84a-benchmark-report.
  It adds paired wall/CPU times, estimated gaps, exceedance counts and timer overhead.
  Sound, workload, target and wall p99 exit checks stay unchanged. Slow-core CPU spikes remain open.

  The owner accepted input modes 85 on 2026-11-03.
  Its archive is openspec/changes/archive/2026-11-03-85-input-modes. Implementation, offline tests and renders are complete.
  Keyboard and MIDI share pad handling and input state. Controller commands precede following hits. Deferred hits keep their actual releases.
  Separate fixes preserve mixed Chop holds and prevent late direct notifications from starting Chop actions.
  The dispatch move changed no method body. Keys, profiles, saved data and the callback stay unchanged.
  This is overall acceptance. Physical-controller checks remain unverified. Separate WAV listening remains unreported.

  The owner accepted the screen registry (86) on 2026-11-04.
  Its archive is openspec/changes/archive/2026-11-04-86-screen-registry.
  Implementation is complete at a186fbb. Commit e90543c records offline verification.
  The registry preserves existing keys, help, learned assignments and FX rules for valid input states.
  Invalid shared MIDI state rejects new actions but preserves original releases and pending-input order.
  This is overall acceptance, not individual keyboard, physical-controller or WAV listening results.
  Section 86 of docs/LIVE-CHECKS.md records evidence and separate keyboard, controller and listening checks.
  The callback timing issue remains open.

  The owner accepted legacy folder migration removal (86a) on 2026-11-04.
  Its archive is openspec/changes/archive/2026-11-04-86a-remove-legacy-migration.
  Startup reads current ptsr files only. Old folders, XDG paths, saved formats and FX conversion stay unchanged.
  This is overall acceptance, not individual keyboard, physical-controller or listening results.
  The owner authorized archive and merge of the combined PR #5 for 85–86a.

  Save safety 86b–86d and report-only diagnostics 84b merged in PR #9 on 2026-11-05. Their archives are complete.
  The owner requested 87-status-badges and approved its specification step and local signed-off commits.
  This active change covers visual feedback for existing modes, messages, values, inputs and questions, plus an offline screen catalogue.
  The owner approved the specification defaults and the first implementation file plan.
  Preparation starts with a behavior-neutral extraction of screen data. New visual behavior remains unimplemented.
  Publication needs a separate request.
  Yellow now identifies pad modes, not only marking. Marking still sounds.
  Manual save success keeps five seconds. Persistent Save failed stays until saving succeeds.
  Generic controller confirmation remains in 88. Sound, factory bindings and saved formats stay unchanged.
  The order is input and visual changes (87–90), SMC-PAD and its command panel (91–94), then transport and patterns (95–101).
  Read docs/PROJECT.md and docs/plans/README.md before preparing the next change.
  The goal is every non-text action from the SMC-PAD without losing keyboard controls.
  Requirements are drafts and will change. docs/VISION.md and docs/plans/ are guides, not requirements.
  Deferred changes are preparation only. Activate one change before implementation.

  Normally use a separate branch. The owner requested plan/controller-first-patterns for 84, 84a and 85 as an exception.
  Closure of 85 and work on 86 share 86-screen-registry and one PR by owner request. Keep their commits separate.
  On 2026-11-04 the owner authorized archive of 86, local signed-off commits and PR publication for the combined 85–86 work.
  The owner also requested an ASD-STE100 review of the relevant documents in that PR.
  AGENTS.md gives the mandatory real-time, keyboard and test rules.

rules:
  proposal:
    - Write short and without jargon. The owner is not a programmer.
    - Always state what is out of scope.
    - End with a `How to verify` section. Give manual steps and sounds to check.
  tasks:
    - Every audio task ends with a render in renders/ or an automated render test.
    - Keep tasks small. Each task ends in a working state and a commit.
