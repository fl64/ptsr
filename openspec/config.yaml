schema: spec-driven

context: |
  ptsr is a Linux terminal sampler written in Rust. License: GPL-3.0.
  The stack uses JACK/PipeWire, midir, ratatui, crossterm with the kitty keyboard protocol, symphonia, aubio, rtrb and TOML.
  The owner is a musician and does not read code. The owner checks specifications, renders in renders/ and the program by hand.
  Write all artifacts and UI text in English. Speak Russian with the owner. Keep proposals short, plain and without jargon.
  Keep the OpenSpec keywords SHALL, WHEN and THEN unchanged.

  The current baseline includes sample loading, chopping, pad play and shaping, projects, recording, MIDI learn and shared FX.
  The owner accepted change 82, which adds F4 FX and safe X-Session controls. Its archive is complete.
  The SMC-PAD profile remains a template. Transport and metronome are implemented. Pattern sequencing is not implemented.

  The owner accepted keymap cleanup 83a without completing the manual checks in docs/LIVE-CHECKS.md.
  Its archive commit is 2b084d1. This acceptance implies no listening or physical SMC-PAD pass.
  The shipped keys are J/L for values, U/O for banks and Tab for assignment order.

  The owner checked and accepted input parity 84 on 2026-11-03.
  Its archive is openspec/changes/archive/2026-11-03-84-input-parity. Physical-controller checks remain unverified.
  Callback benchmark peaks above the 50% budget target remain unresolved.

  The owner accepted report-only change 84a on 2026-11-03.
  Its archive is openspec/changes/archive/2026-11-03-84a-benchmark-report.
  It adds paired wall/CPU times, estimated gaps, exceedance counts and timer overhead.
  Sound, workload, target and wall p99 exit checks stay unchanged. Slow-core CPU spikes remain open.

  The owner accepted input modes 85 on 2026-11-03.
  Its archive is openspec/changes/archive/2026-11-03-85-input-modes. Implementation, offline tests and renders are complete.
  Keyboard and MIDI share pad handling and input state. Controller commands precede following hits. Deferred hits keep their actual releases.
  Separate fixes preserve mixed Chop holds and prevent late direct notifications from starting Chop actions.
  The dispatch move changed no method body. Keys, profiles, saved data and the callback stay unchanged.
  This is overall acceptance. Physical-controller checks remain unverified. Separate WAV listening remains unreported.

  The owner accepted the screen registry (86) on 2026-11-04.
  Its archive is openspec/changes/archive/2026-11-04-86-screen-registry.
  Implementation is complete at a186fbb. Commit e90543c records offline verification.
  The registry preserves existing keys, help, learned assignments and FX rules for valid input states.
  Invalid shared MIDI state rejects new actions but preserves original releases and pending-input order.
  This is overall acceptance, not individual keyboard, physical-controller or WAV listening results.
  Section 86 of docs/LIVE-CHECKS.md records evidence and separate keyboard, controller and listening checks.
  The callback timing issue remains open.

  The owner accepted legacy folder migration removal (86a) on 2026-11-04.
  Its archive is openspec/changes/archive/2026-11-04-86a-remove-legacy-migration.
  Startup reads current ptsr files only. Old folders, XDG paths, saved formats and FX conversion stay unchanged.
  This is overall acceptance, not individual keyboard, physical-controller or listening results.
  The owner authorized archive and merge of the combined PR #5 for 85–86a.

  Save safety 86b–86d and report-only diagnostics 84b merged in PR #9 on 2026-11-05. Their archives are complete.
  The owner requested 87-status-badges and approved its specification step and local signed-off commits.
  The owner accepted 87 on 2026-11-07 and authorized archive, checks and squash merge in PR #10: https://github.com/fl64/ptsr/pull/10.
  Archive: openspec/changes/archive/2026-11-07-87-status-badges/.
  It covers visual feedback for existing modes, messages, values, inputs and questions, plus an offline screen catalogue.
  The owner approved the specification defaults and the first implementation file plan.
  The behavior-neutral preparation is complete: 12 screen snapshot methods are in crates/app/src/view.rs.
  Shared title badges now identify existing modes, with compact edit-page names and compound placement labels.
  Settings keeps its title visible when MIDI rows scroll. PLAY and LISTEN keep their widths. Source-specific input priorities stay unchanged.
  Pad corners now show placement targets, existing replacement questions and planned slice numbers. Yellow mode frames retain pad state and bank identity.
  Runtime notices share levels, visible-time lifetimes, priority and latest-50 history.
  F1 opens Help first. Tab/Shift+Tab selects Messages, with levels, origins and wrapped text.
  Up/Down and PageUp/PageDown scroll Messages. F1/Esc closes help without changing the work through those local controls.
  Each result keeps its keyboard, actual device or system origin. Startup acknowledgement and silent successful autosave stay unchanged.
  A new press acknowledges only the Error that a frame showed. Releases and repeated knob values do not acknowledge it.
  Offline notice and save-priority regressions pass. The owner accepted step 4.3.
  F1 navigation retains parameter pages and banks behind help. Existing pad routes and higher-priority input remain unchanged.
  Help and Messages share the owner-accepted stable frame.
  Applied values now use a shared one-second popup with object labels and numeric range bars.
  Pickup, refusals, scope-limit messages and editor priority retain their behavior.
  Input-source state now keeps connection identities and original receipt times across production routes.
  Old connections cannot activate a new connection. Delayed delivery does not extend the original deadline.
  Project changes keep source identities and deadlines.
  Source feedback does not change actions, acknowledgements, velocities or release ownership.
  Shared status keeps recording seconds, permanent KB, the last used controller number, actual audio data, master and project details.
  Input emphasis lasts one second. Keyboard activity and expiry retain the controller number and fixed columns.
  A permanent * is dim when saved and yellow when pending. Save failed remains explicit.
  Full port names stay in F12 Input. CPU and full xrun diagnostics stay in F12 Audio.
  The incomplete SMC-PAD example uses .toml.example and is not a working profile.
  Screen learning uses the fixed three-row help band and keeps the status visible. Its hints follow effective keys.
  Unchanged badge, input-label and status text now use UI-thread caches. Timers, meters, notices, playback and hints retain live updates.
  Questions show effective keyboard and connected MIDI answers. Large questions retain safety text and answer rows without changing target checks.
  Text overlays now remove intersecting kitty pictures before text output and restore the current wave afterward. Unoccluded pictures stay unchanged.
  `task screens` now checks the screen/mode matrix and writes deterministic ANSI files at both supported sizes.
  The files stay local under renders/screens/. Real kitty composition still needs a manual check.
  Active-delta coverage now checks test declarations and their attached scenario descriptions.
  Documentation now links catalogue files and separate keyboard, controller, graphics and listening procedures.
  Overall acceptance does not establish individual keyboard, physical-controller, kitty or listening results. Unreported checks remain unverified.
  Earlier callback maximum-budget failures remain unresolved.
  Closure order: owner acceptance, archive in the same PR, checks, then squash merge. Keep the branch after merge.
  Yellow now identifies pad modes, not only marking. Marking still sounds.
  Manual save success keeps five seconds. Persistent Save failed stays until saving succeeds.
  Generic controller confirmation remains in 88. Sound, factory bindings and saved formats stay unchanged.
  The order is input and visual changes (87–90), SMC-PAD and its command panel (91–94), then transport and patterns (95–101).
  Read docs/PROJECT.md and docs/plans/README.md before preparing the next change.
  The goal is every non-text action from the SMC-PAD without losing keyboard controls.
  Requirements are drafts and will change. docs/VISION.md and docs/plans/ are guides, not requirements.
  Deferred changes are preparation only. Activate one change before implementation.
  The owner accepted 87a-copy-names on 2026-11-07 after the short keyboard check.
  Archive: openspec/changes/archive/2026-11-07-87a-copy-names/. The main pad-assignment spec contains its requirements.
  The owner approved numbered copy names, reuse of the smallest free number, manual markers and occupied-target names.
  The owner reported success for repeated copies, a copy of a copy, numbered names and silent placement.
  Remaining keyboard checks, physical-controller checks and separate listening remain unverified.
  The owner authorized archive, checks, signed-off commits, push, a PR and squash merge. Keep the branch.
  Work stays in the main repository folder. No change is active. Change 88 needs separate activation.
  Existing names, sample files, sound, controls and saved formats stay unchanged.

  The owner accepted 95-transport and authorized specification sync, archive and checks on 2026-11-08.
  Archive: openspec/changes/archive/2026-11-08-95-transport/. No change is active.
  Its requirements are in the main transport, keyboard, midi-learn, projects and screen-layout specifications.
  The audio-thread clock runs at 40–300 BPM. Space toggles it on Pads, FX and Settings. Chop and Files keep previews.
  Format 4 saves tempo and metronome preference, not running state or position. Formats 1–3 remain readable.
  Overall acceptance does not establish individual keyboard, terminal, physical-controller or listening results.
  Earlier callback maximum-budget failures remain open. A passing p99 exit or later maximum does not close them.
  Separate metronome waveform visuals and diagnosis of a click at Chop preview start remain deferred.
  The owner later authorized push, PR publication and squash merge after required checks pass. Keep the branch and recorded limits.
  Keep repository-only roadmap edits separate.

  Normally use a separate branch. The owner requested plan/controller-first-patterns for 84, 84a and 85 as an exception.
  Closure of 85 and work on 86 share 86-screen-registry and one PR by owner request. Keep their commits separate.
  On 2026-11-04 the owner authorized archive of 86, local signed-off commits and PR publication for the combined 85–86 work.
  The owner also requested an ASD-STE100 review of the relevant documents in that PR.
  AGENTS.md gives the mandatory real-time, keyboard and test rules.

rules:
  proposal:
    - Write short and without jargon. The owner is not a programmer.
    - Always state what is out of scope.
    - End with a `How to verify` section. Give manual steps and sounds to check.
  tasks:
    - Every audio task ends with a render in renders/ or an automated render test.
    - Keep tasks small. Each task ends in a working state and a commit.
