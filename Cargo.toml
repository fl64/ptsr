[workspace]
resolver = "3"
members = ["crates/engine", "crates/input", "crates/tui", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
